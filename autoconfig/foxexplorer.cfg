// Fox Explorer 6 — autoconfig bootstrap. (The first line of this file must be a comment.)
// Registers resource://fe6/ -> <install dir>/foxexplorer/ and starts the IE6 chrome layer.

// ---- defaults (users can still change all of these in about:config / Settings)
defaultPref("browser.tabs.inTitlebar", 1);                         // lets us draw the Win98 caption
defaultPref("browser.toolbars.bookmarks.visibility", "always");     // the "Links" bar
defaultPref("browser.uidensity", 1);                               // compact metrics
defaultPref("widget.gtk.rounded-bottom-corners.enabled", false);
defaultPref("sidebar.revamp", false);                              // classic Explorer-bar style sidebar
defaultPref("sidebar.verticalTabs", false);
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true); // allow your own userChrome.css on top
defaultPref("browser.compactmode.show", true);
defaultPref("browser.startup.homepage", "resource://fe6/start.html");
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("startup.homepage_welcome_url", "");
defaultPref("startup.homepage_override_url", "");
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("widget.gtk.overlay-scrollbars.enabled", false);           // classic scroll bars with arrow buttons
defaultPref("widget.non-native-theme.scrollbar.style", 4);
defaultPref("ui.useOverlayScrollbars", 0);
defaultPref("foxexplorer.colorScheme", "light");
defaultPref("foxexplorer.statusBar", true);
defaultPref("foxexplorer.classicTitlebar", true);
defaultPref("foxexplorer.showHistoryMenu", false);
defaultPref("foxexplorer.showAppMenu", false);
defaultPref("foxexplorer.debug", false);

try {
  const Cc_ = Components.classes, Ci_ = Components.interfaces;
  const dirsvc = Cc_["@mozilla.org/file/directory_service;1"].getService(Ci_.nsIProperties);
  const ios = Cc_["@mozilla.org/network/io-service;1"].getService(Ci_.nsIIOService);
  let dir = dirsvc.get("GreD", Ci_.nsIFile);
  dir.append("foxexplorer");
  if (!dir.exists()) {                          // tarball layouts where GreD != app dir
    dir = dirsvc.get("XCurProcD", Ci_.nsIFile);
    dir.append("foxexplorer");
  }
  const res = ios.getProtocolHandler("resource").QueryInterface(Ci_.nsIResProtocolHandler);
  res.setSubstitutionWithFlags("fe6", ios.newFileURI(dir), Ci_.nsISubstitutingProtocolHandler.ALLOW_CONTENT_ACCESS);
  // Tag the module URL with the file's timestamp: Firefox's startup cache is keyed by URL and
  // only cleared when Firefox itself updates, so this makes Fox Explorer updates load at once.
  const boot = dir.clone();
  boot.append("fe6-boot.sys.mjs");
  const stamp = boot.exists() ? boot.lastModifiedTime : 0;
  ChromeUtils.importESModule("resource://fe6/fe6-boot.sys.mjs?v=" + stamp).FoxExplorer6.init();
} catch (ex) {
  Components.utils.reportError("Fox Explorer 6 failed to start: " + ex);
}
