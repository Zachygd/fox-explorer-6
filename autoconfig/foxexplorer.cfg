// ---- no background check-ins with Mozilla's servers (you can turn these back on in about:config)
defaultPref("browser.region.network.url", "");                   // region lookup
defaultPref("browser.region.update.enabled", false);
defaultPref("network.captive-portal-service.enabled", false);    // detectportal.firefox.com checks
defaultPref("network.connectivity-service.enabled", false);
defaultPref("dom.push.connection.enabled", false);               // always-on push.services connection
defaultPref("extensions.systemAddon.update.enabled", false);     // built-in add-ons update with each build
defaultPref("extensions.systemAddon.update.url", "");

// ---- no Google Safe Browsing (phishing/malware lists and download checks come from Google).
// Turn it back on under Internet Options > Privacy & Security > "Block dangerous and deceptive
// content". Mozilla's own tracking-protection lists are separate and stay on.
defaultPref("browser.safebrowsing.malware.enabled", false);
defaultPref("browser.safebrowsing.phishing.enabled", false);
defaultPref("browser.safebrowsing.downloads.enabled", false);
defaultPref("browser.safebrowsing.downloads.remote.enabled", false);
defaultPref("browser.safebrowsing.downloads.remote.block_potentially_unwanted", false);
defaultPref("browser.safebrowsing.downloads.remote.block_uncommon", false);
defaultPref("browser.safebrowsing.provider.google4.dataSharing.enabled", false);

defaultPref("foxexplorer.colorScheme", "light");
defaultPref("foxexplorer.statusBar", true);
defaultPref("foxexplorer.classicTitlebar", true);
defaultPref("foxexplorer.showHistoryMenu", false);
defaultPref("foxexplorer.showAppMenu", false);
defaultPref("foxexplorer.debug", false);

try {
  const Cc_ = Components.classes, Ci_ = Components.interfaces;
  const dirsvc = Cc_["@mozilla.org/file/directory_service;1"].getService(Ci_.nsIProperties);
  const ios = Cc_["@mozilla.org/network/io-service;1"].getService(Ci_.nsIIOService);
  let dir = dirsvc.get("GreD", Ci_.nsIFile);
  dir.append("foxexplorer");
  if (!dir.exists()) {                          // tarball layouts where GreD != app dir
    dir = dirsvc.get("XCurProcD", Ci_.nsIFile);
    dir.append("foxexplorer");
  }
  const res = ios.getProtocolHandler("resource").QueryInterface(Ci_.nsIResProtocolHandler);
  res.setSubstitutionWithFlags("fe6", ios.newFileURI(dir), Ci_.nsISubstitutingProtocolHandler.ALLOW_CONTENT_ACCESS);
  // Tag the module URL with the file's timestamp: Firefox's startup cache is keyed by URL and
  // only cleared when Firefox itself updates, so this makes Fox Explorer updates load at once.
  const boot = dir.clone();
  boot.append("fe6-boot.sys.mjs");
  const stamp = boot.exists() ? boot.lastModifiedTime : 0;
  ChromeUtils.importESModule("resource://fe6/fe6-boot.sys.mjs?v=" + stamp).FoxExplorer6.init();
} catch (ex) {
  Components.utils.reportError("Fox Explorer 6 failed to start: " + ex);
}
