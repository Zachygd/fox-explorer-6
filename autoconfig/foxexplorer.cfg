// Fox Explorer 6 — autoconfig bootstrap. (The first line of this file must be a comment.)
// Registers resource://fe6/ -> <install dir>/foxexplorer/ and starts the IE6 chrome layer.

// ---- defaults (users can still change all of these in about:config / Settings)
defaultPref("browser.tabs.inTitlebar", 1);                         // lets us draw the Win98 caption
defaultPref("browser.toolbars.bookmarks.visibility", "always");     // the "Links" bar
defaultPref("browser.uidensity", 1);                               // compact metrics
defaultPref("widget.gtk.rounded-bottom-corners.enabled", false);
defaultPref("sidebar.revamp", false);                              // classic Explorer-bar style sidebar
defaultPref("sidebar.verticalTabs", false);
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true); // allow your own userChrome.css on top
defaultPref("browser.compactmode.show", true);
defaultPref("browser.startup.homepage", "resource://fe6/start.html");
defaultPref("browser.aboutwelcome.enabled", false);
defaultPref("startup.homepage_welcome_url", "");
defaultPref("startup.homepage_override_url", "");
defaultPref("browser.startup.homepage_override.mstone", "ignore");
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("widget.gtk.overlay-scrollbars.enabled", false);           // classic scroll bars with arrow buttons
defaultPref("widget.non-native-theme.scrollbar.style", 4);
defaultPref("ui.useOverlayScrollbars", 0);
// ---- no telemetry: nothing is sent to Mozilla about how you use the browser.
// Locked, so it can't be switched back on by a study, an update or a stray setting.
lockPref("datareporting.healthreport.uploadEnabled", false);   // Glean / health report
lockPref("datareporting.policy.dataSubmissionEnabled", false);  // also hides the "sends data" bar
lockPref("datareporting.usage.uploadEnabled", false);           // daily usage ping
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.server", "data:,");
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.coverage.opt-out", true);
lockPref("toolkit.coverage.opt-out", true);
lockPref("toolkit.coverage.endpoint.base", "");
lockPref("browser.ping-centre.telemetry", false);
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.urlbar.eventTelemetry.enabled", false);
lockPref("dom.private-attribution.submission.enabled", false);   // "privacy-preserving" ad attribution
lockPref("browser.tabs.crashReporting.sendReport", false);
lockPref("breakpad.reportURL", "");
// ---- no studies or remote experiments
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("app.normandy.api_url", "");
lockPref("messaging-system.rsexperimentloader.enabled", false);
lockPref("nimbus.telemetry.targetingContextEnabled", false);
// ---- no sponsored content, Pocket or recommendations
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredCheckboxes", false);
defaultPref("browser.topsites.contile.enabled", false);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
defaultPref("browser.newtabpage.activity-stream.feeds.topsites.sponsored", false);
defaultPref("browser.newtabpage.activity-stream.discoverystream.enabled", false);
defaultPref("browser.newtabpage.activity-stream.feeds.weatherfeed", false);
defaultPref("browser.newtabpage.activity-stream.showWeather", false);
defaultPref("browser.newtabpage.activity-stream.feeds.wallpaperfeed", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);
defaultPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);
defaultPref("browser.urlbar.suggest.quicksuggest.sponsored", false);
defaultPref("browser.urlbar.suggest.quicksuggest.nonsponsored", false);
defaultPref("browser.urlbar.quicksuggest.dataCollection.enabled", false);
defaultPref("browser.urlbar.suggest.weather", false);
defaultPref("browser.urlbar.suggest.trending", false);
defaultPref("browser.urlbar.trending.featureGate", false);
defaultPref("browser.discovery.enabled", false);                 // add-on recommendations
defaultPref("extensions.getAddons.showPane", false);
defaultPref("extensions.htmlaboutaddons.recommendations.enabled", false);
defaultPref("browser.vpn_promo.enabled", false);
defaultPref("browser.promo.focus.enabled", false);
